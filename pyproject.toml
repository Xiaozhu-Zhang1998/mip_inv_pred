[build-system]
requires=["setuptools>=69","wheel"]
build-backend="setuptools.build_meta"

[project]
name="invariant-prediction-mip"
version="0.1.0"
description="Mixed-integer optimization for invariant predictions from multi-environment data"
readme="README.md"
requires-python=">=3.10"
dependencies=["numpy>=1.24","scipy>=1.10","pandas>=2.0","scikit-learn>=1.3","tqdm>=4.65"]

[project.optional-dependencies]
mip=["gurobipy>=11"]
torch=["torch>=2"]
all=["gurobipy>=11","torch>=2"]
test=["pytest>=7"]

[tool.setuptools.packages.find]
where=["src"]
